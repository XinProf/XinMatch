name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow marker suite (GSAS-II / turn-on / acceptance)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ruff + mypy + pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install package (headless extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: ruff
        run: python -m ruff check xinmatch tools tests

      - name: mypy
        run: python -m mypy

      # The reference databases (0.5-1 GB) are not in the repository, so the
      # tests that need them skip themselves; everything else must pass.
      - name: pytest (fast)
        if: ${{ !inputs.slow }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -p no:cacheprovider

      - name: pytest (slow marker)
        if: ${{ inputs.slow }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m slow -p no:cacheprovider

  packaging:
    name: wheel contains package data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Assert runtime resources are packaged
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "xinmatch/core/db/schema.sql",
              "xinmatch/ui/assets/3dmol/structure_view.html",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel is missing runtime resources: {missing}")
          print(f"{wheel}: {len(names)} entries, all required resources present")
          PY
