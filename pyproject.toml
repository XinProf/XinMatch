[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xinmatch"
version = "1.2.0"
description = "XinMatch — Open-source powder XRD phase analysis platform (clean-room implementation guided by publicly documented XRD phase-analysis workflows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XinMatch Contributors" }]
keywords = ["XRD", "powder diffraction", "phase analysis", "Rietveld", "search-match"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "gemmi>=0.6",          # CIF / crystallography (MIT)
    "lmfit>=1.2",          # least-squares with parameter constraints
    "pyyaml>=6.0",         # config / batch scripts
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",        # Qt6 GUI (LGPL)
    "pyqtgraph>=0.13",     # high-performance pattern plotting
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.80",
    "ruff>=0.1",
    "mypy>=1.6",
]

[project.scripts]
xinmatch = "xinmatch.cli.main:main"

[tool.setuptools.packages.find]
include = ["xinmatch*"]

# ---- Tool config ----

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

# Pre-existing lint issues in frozen COD-builder files (committed before 1.0.0,
# kept untouched per project rule): BATCH const naming (N806) and an unused
# numpy import (F401). Excluded here so `ruff check .` stays green without
# modifying protected files.
[tool.ruff.lint.per-file-ignores]
"tools/build_cod_xinmatch.py" = ["N806"]
"tests/test_build_cod_xinmatch.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "slow: slow-running tests (GSAS-II refinement / long computations), excluded from default CI runs",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Scope: type-check the package from ``python -m mypy`` (no args).
# xinmatch/core/search is owned by a parallel task (T0.6 task A) and xinmatch/
# core/refine is out of scope for this milestone; both are excluded here and
# recorded as baseline exemptions in docs/mypy_baseline.md.
#
# ``exclude`` prunes them from the initial file scan; ``overrides`` silences
# any residual errors that surface when in-scope modules import them.  Both
# are baseline exemptions, not a signal that those packages are error-free.
files = ["xinmatch"]
exclude = [
    "xinmatch[/\\\\]core[/\\\\]search",
    "xinmatch[/\\\\]core[/\\\\]refine",
]

[[tool.mypy.overrides]]
module = ["xinmatch.core.search.*", "xinmatch.core.refine.*"]
ignore_errors = true
