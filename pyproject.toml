[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xinmatch"
version = "3.3.0"
description = "XinMatch — Open-source powder XRD phase analysis platform (clean-room implementation guided by publicly documented XRD phase-analysis workflows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Dual License (Academic + Commercial) — see LICENSE / LICENSE-CN" }
authors = [{ name = "XinMatch Contributors" }]
keywords = ["XRD", "powder diffraction", "phase analysis", "Rietveld", "search-match"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "gemmi>=0.6",          # CIF / crystallography (MIT)
    "lmfit>=1.2",          # least-squares with parameter constraints
    "pyyaml>=6.0",         # config / batch scripts
    "pyserial>=3.5",       # serial instrument control (T14.4)
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",        # Qt6 GUI (LGPL)
    "pyqtgraph>=0.13",     # high-performance pattern plotting
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.80",
    "ruff>=0.1",
    "mypy>=1.6",
]

[project.scripts]
xinmatch = "xinmatch.cli.main:main"

[tool.setuptools.packages.find]
include = ["xinmatch*"]

# Non-Python files required at runtime.  Without these declarations a plain
# ``pip install xinmatch`` produces a wheel that imports but cannot create a
# reference database (``schema.sql`` missing), cannot compute reference peaks
# from a CIF (``atomic_scattering_params.json`` missing, which froze the peak
# engine only when a CIF was actually imported) and whose 3D viewer has no JS.
[tool.setuptools.package-data]
"xinmatch.core.db" = ["*.sql", "data/*.json"]
"xinmatch.ui.assets" = ["3dmol/*"]

# ---- Tool config ----

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

# Pre-existing lint issues in frozen COD-builder files (committed before 1.0.0,
# kept untouched per project rule): BATCH const naming (N806) and an unused
# numpy import (F401). Excluded here so `ruff check .` stays green without
# modifying protected files.
[tool.ruff.lint.per-file-ignores]
"tools/build_cod_xinmatch.py" = ["N806"]
"tests/test_build_cod_xinmatch.py" = ["F401"]

# One-off documentation conversion helpers (2026-10-12, not part of the app
# runtime): OOXML element variables are conventionally camelCase (w:rPr /
# w:rFonts / w:tblPr / ...), matching python-docx ecosystem style.
"tools/md_to_docx.py" = ["N806"]
"tools/merge_docs_to_single_md.py" = ["N806", "B007"]

# v1.7.0: xinmatch/utils/registration.py is vendored byte-identical from the
# PolyXRD family reference (D:\Project\XRD\PolyXRD-Reg\registration.py) so the
# two can be diffed when the family mechanism changes.  Its own house style
# (UTF-8 coding declaration, typing.Optional) predates this repo's ruff
# settings; exempted here instead of editing the vendored copy.
"xinmatch/utils/registration.py" = ["UP009", "UP045"]

# ``tools/_probe_peak_convention.py`` is an archived one-off diagnostic used to
# derive and verify the frozen peak convention (docs/峰口径冻结-v3.0.0.md).  It
# is evidence, not runtime code: its %-formatting, short math variable names and
# unused loop targets are deliberate, and rewriting 138 print statements would
# only make the historical record harder to diff against the numbers in that
# document.  Every other file under ``tools`` is still linted, so a newly added
# probe cannot hide behind this exemption.
"tools/_probe_peak_convention.py" = ["UP031", "B007", "B905", "N806", "E741", "F841", "SIM105"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# ``-m "not slow"`` keeps the default run usable: the ``slow`` marker covers
# the numerically hard cases (turn-on least-squares, GSAS-II subprocesses,
# L3 acceptance curve_fit).  A command-line ``-m`` overrides this, so
# ``pytest -m slow`` and ``pytest -m ""`` both work for the nightly run.
addopts = '-q --tb=short -m "not slow"'
markers = [
    "slow: slow-running tests (GSAS-II refinement / long computations), excluded from default CI runs",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Scope: type-check the whole package from ``python -m mypy`` (no args).
# The former baseline exemptions for xinmatch/core/search and xinmatch/core/
# refine were retired: all errors there were fixed and both packages are now
# checked like every other module (see docs/mypy_baseline.md).
files = ["xinmatch"]
